<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#grad1)"/>
  
  <!-- Decorative elements -->
  <circle cx="420" cy="90" r="60" fill="rgba(255,255,255,0.1)"/>
  <circle cx="90" cy="420" r="50" fill="rgba(255,255,255,0.08)"/>
  <circle cx="450" cy="380" r="30" fill="rgba(255,255,255,0.06)"/>
  
  <!-- Document shape with shadow -->
  <g filter="url(#shadow)">
    <rect x="120" y="80" width="272" height="352" rx="20" fill="white"/>
  </g>
  
  <!-- Document fold effect -->
  <path d="M320 80 L392 152 L320 152 Z" fill="#e0e7ff"/>
  <path d="M320 80 L320 152 L392 152" fill="none" stroke="#c7d2fe" stroke-width="2"/>
  
  <!-- Header line -->
  <rect x="160" y="180" width="192" height="16" rx="8" fill="url(#grad2)"/>
  
  <!-- Content lines -->
  <rect x="160" y="220" width="160" height="10" rx="5" fill="#c4b5fd"/>
  <rect x="160" y="245" width="180" height="10" rx="5" fill="#c4b5fd"/>
  <rect x="160" y="270" width="140" height="10" rx="5" fill="#c4b5fd"/>
  
  <!-- Section divider -->
  <rect x="160" y="300" width="192" height="2" rx="1" fill="#e0e7ff"/>
  
  <!-- More content lines -->
  <rect x="160" y="325" width="170" height="10" rx="5" fill="#ddd6fe"/>
  <rect x="160" y="350" width="150" height="10" rx="5" fill="#ddd6fe"/>
  <rect x="160" y="375" width="120" height="10" rx="5" fill="#ddd6fe"/>
  
  <!-- Sparkle/Star decoration -->
  <g transform="translate(300, 340)" filter="url(#glow)">
    <path d="M24 0 L28 16 L44 20 L28 24 L24 40 L20 24 L4 20 L20 16 Z" fill="#fcd34d"/>
  </g>
  
  <!-- AI Badge -->
  <g filter="url(#glow)">
    <circle cx="400" cy="400" r="56" fill="url(#grad2)"/>
    <text x="400" y="412" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold">AI</text>
  </g>
  
  <!-- Small sparkles -->
  <circle cx="140" cy="120" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="380" cy="200" r="3" fill="rgba(255,255,255,0.5)"/>
  <circle cx="130" cy="300" r="3" fill="rgba(255,255,255,0.4)"/>
</svg>