name: Android test APK

on:
  push:
    branches: [feat/gemini-rstudio]
    paths:
      - '.github/workflows/android-debug.yml'
      - 'capacitor.config.json'
      - 'vite.android.config.ts'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - '.env'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_PROJECT_ID: aeapocnycabxfckllbsw
      VITE_SUPABASE_URL: https://aeapocnycabxfckllbsw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FsFNX2KQhE8GsEwjVUwrJA_W0cIFMPb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install locked web dependencies
        run: npm ci --legacy-peer-deps

      - name: Install pinned packaging dependencies in CI checkout
        run: npm install --save-exact --package-lock=false --legacy-peer-deps @capacitor/core@7.0.1 @capacitor/android@7.0.1 @capacitor/cli@7.0.1

      - name: Build bundled Android web assets
        run: npm run build -- --config vite.android.config.ts --mode android

      - name: Check target backend and bundled credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const files = [];
          function walk(dir) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p);
              else if (/\.(js|html|json)$/.test(p)) files.push(p);
            }
          }
          walk('dist');
          const contents = files.map(p => fs.readFileSync(p, 'utf8')).join('\n');
          if (!contents.includes('aeapocnycabxfckllbsw.supabase.co')) throw new Error('rstudio backend missing');
          if (contents.includes('bubkiuqriimtvzljwmqx.supabase.co')) throw new Error('Old backend remains');
          if (/AIza[0-9A-Za-z_-]{35}/.test(contents) || /sb_secret_[0-9A-Za-z_-]+/.test(contents)) {
            throw new Error('Server credential pattern detected in web bundle');
          }
          console.log('rstudio configured; no Google/Supabase secret-key patterns detected.');
          NODE

      - name: Generate native Android project
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android

      - name: Compile debug-signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and package APK
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ResumeStudio-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apk-output/ResumeStudio-test.apk
          cd apk-output
          sha256sum ResumeStudio-test.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResumeStudio-test-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 14

      - name: Installation summary
        run: |
          echo '## ResumeStudio test APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **ResumeStudio-test-apk** from Artifacts, unzip it, and install **ResumeStudio-test.apk** on Android.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Internet is required for Gemini/Supabase. This is a debug-signed test build, not a Play Store release.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Future builds may require uninstalling the old test APK because the CI debug certificate is ephemeral. See ANDROID_TEST.md for PDF and auth limitations.' >> "$GITHUB_STEP_SUMMARY"
