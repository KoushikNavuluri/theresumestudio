    <script>
      (function(){
        try {
          var themes=["light","ocean","forest","sunset","lavender","dark","midnight","noir","dracula","cyberpunk"];
          var dark=["dark","midnight","noir","dracula","cyberpunk"];
          var s=localStorage.getItem("app-theme")||"light";
          var t=themes.indexOf(s)>-1?s:"light";
          var r=document.documentElement;
          themes.forEach(function(x){r.classList.remove("theme-"+x)});
          r.classList.remove("dark");
          r.classList.add("theme-"+t);
          if(dark.indexOf(t)>-1)r.classList.add("dark");
          r.style.colorScheme=dark.indexOf(t)>-1?"dark":"light";
        }catch(e){}
      })();
    </script>
    <style>
      /* Splash screen styles - shown before React loads */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0f0f14 0%, #1a1a2e 50%, #16213e 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse-glow 2s infinite;
        box-shadow: 0 0 60px rgba(99, 102, 241, 0.4);
      }
      .splash-logo svg {
        width: 48px;
        height: 48px;
        color: white;
      }
      .splash-title {
        margin-top: 24px;

        font-weight: 700;
        color: white;

      .splash-subtitle {

        color: rgba(255, 255, 255, 0.6);
      }
      .splash-loader {
        margin-top: 40px;
        width: 120px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .splash-loader-bar {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        border-radius: 3px;
        animation: loader-slide 1.2s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(99, 102, 241, 0.4); }
        50% { transform: scale(1.05); box-shadow: 0 0 80px rgba(99, 102, 241, 0.6); }
      }
      @keyframes loader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
